# Local copy of the lab stack for development: MQTT broker, InfluxDB, Telegraf (MQTT -> InfluxDB), Grafana.
# docker compose up -d     then open Grafana on http://localhost:3000 (admin / admin)
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883", "9001:9001"]
    volumes: ["./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: buspulse
      DOCKER_INFLUXDB_INIT_PASSWORD: buspulse-dev-pass
      DOCKER_INFLUXDB_INIT_ORG: buspulse
      DOCKER_INFLUXDB_INIT_BUCKET: buspulse
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: buspulse-dev-token
    volumes: ["influx:/var/lib/influxdb2"]
  telegraf:
    image: telegraf:1.30
    depends_on: [mosquitto, influxdb]
    volumes: ["./telegraf.conf:/etc/telegraf/telegraf.conf:ro"]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro"]
    depends_on: [influxdb]
volumes:
  influx: {}
