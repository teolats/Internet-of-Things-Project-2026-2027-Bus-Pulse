# Reads the BusPulse MQTT topics and writes them to InfluxDB 2
[agent]
  interval = "5s"
  flush_interval = "5s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["buspulse/bus/+/telemetry"]
  qos = 0
  name_override = "bus_telemetry"
  data_format = "json"
  tag_keys = ["busId", "line", "direction", "occupancyLevel"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["buspulse/bus/+/event"]
  qos = 1
  name_override = "bus_event"
  data_format = "json"
  tag_keys = ["busId", "line", "type", "severity"]
  json_string_fields = ["message", "stop", "vehicleClass"]
  json_time_key = "ts"
  json_time_format = "2006-01-02T15:04:05Z07:00"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "buspulse-dev-token"
  organization = "buspulse"
  bucket = "buspulse"
